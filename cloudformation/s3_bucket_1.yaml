
AWSTemplateFormatVersion: '2010-09-09'
Description: Analytics storage buckets

Resources:
  AnalyticsDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: arc319-analytics-raw-data
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256